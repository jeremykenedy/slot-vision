<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 408" width="392" height="408"><style>@keyframes drift{0%,100%{transform:translateY(-3px)}50%{transform:translateY(5px)}}.reel{animation:drift 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.reel{animation:none}}</style><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs><rect width="392" height="408" rx="16" fill="url(#background)" stroke="#e5e7eb"/><text x="20" y="76" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="-.5">Reel Atrium</text><text x="20" y="105" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12">A quiet cabinet of moving reels and seasonal light.</text><g font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" font-weight="500"><rect x="20" y="132" width="96" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#fbbf24" stroke-width=".8"/><text x="68" y="147" fill="#fbbf24">Real 3D reels</text><rect x="124" y="132" width="102" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#4ade80" stroke-width=".8"/><text x="175" y="147" fill="#4ade80">Four seasons</text><rect x="234" y="132" width="138" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#60a5fa" stroke-width=".8"/><text x="303" y="147" fill="#60a5fa">No tracking or analytics</text></g><g transform="translate(104 205) scale(1.12)"><rect x="7" y="0" width="130" height="142" rx="12" fill="#13353a" stroke="#b99149" stroke-width="4"/><path d="M20 25H124M20 112H124" stroke="#b99149" stroke-width="5"/><rect x="23" y="39" width="98" height="63" rx="3" fill="#f4ebce"/><path d="M55 39V102M88 39V102" stroke="#b99149" stroke-width="3"/><g class="reel"><circle cx="39" cy="66" r="8" fill="#c53652"/><path d="M68 59L78 69L68 79L60 69Z" fill="#279da5"/><circle cx="104" cy="73" r="8" fill="#d