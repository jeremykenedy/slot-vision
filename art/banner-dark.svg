<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200"><style>@keyframes spin{from{transform:translateY(0)}to{transform:translateY(-52px)}}.reel{animation:spin 2s linear infinite;transform-box:fill-box;transform-origin:center}.second{animation-duration:2.3s;animation-delay:-.8s}.third{animation-duration:2.6s;animation-delay:-1.4s}@media(prefers-reduced-motion:reduce){.reel{animation:none}}</style><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs><rect width="800" height="200" rx="16" fill="url(#background)" stroke="#e5e7eb"/><text x="36" y="80" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Slot Vision</text><text x="38" y="110" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="14">A quiet cabinet of moving reels and seasonal light.</text><g font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" font-weight="500"><rect x="38" y="132" width="96" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#fbbf24" stroke-width=".8"/><text x="86" y="147" fill="#fbbf24">Real 3D reels</text><rect x="144" y="132" width="102" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#4ade80" stroke-width=".8"/><text x="195" y="147" fill="#4ade80">Four seasons</text><rect x="256" y="132" width="143" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#60a5fa" stroke-width=".8"/><text x="327" y="147" fill="#60a5fa">No tracking or analytics</text></g><g transform="translate(580 30)"><rect x="7" y="0" width="130" height="142" rx="12" fill="#13353a" stroke="#b99149" stroke-width="4"/><path d="M20 25H124M20 112H124" stroke="#b99149" stroke-width="5"/><rect x="23" y="39" width="98" height="63" rx="3" fill="#f4ebce"/><path d="M55 39V102M88 39V102" stroke="#b99149" stroke-width="3"/><clipPath id="reel-window"><rect x="24" y="40" width="96" height="61"/></clipPath><g clip-path="