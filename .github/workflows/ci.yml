name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Tests, style and coverage
        run: bash test.sh
      - name: Build unsigned review APK
        run: UNSIGNED=1 bash build.sh
      - name: Check packaged privacy contract
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/reel-atrium.apk > build/permissions.txt
          if grep -q 'uses-permission' build/permissions.txt; then cat build/permissions.txt; exit 1; fi
      - name: Check documentation and XML
        run: python3 scripts/check-docs.py
